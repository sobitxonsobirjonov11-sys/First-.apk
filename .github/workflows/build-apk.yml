name: Build A32 Smart Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-dev git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --break-system-packages --upgrade buildozer "cython<3.1" virtualenv setuptools

      - name: Cache buildozer and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-a32-arm64-${{ hashFiles('buildozer.spec') }}

      - name: Build APK with Buildozer
        run: |
          export PATH="$PATH:~/.local/bin"
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log || {
            echo "=== ANIQLANGAN XATO QATORLARI ==="
            grep -i -E "command failed|error:|exception|traceback|no such file|permission denied|not found|failed" build.log | tail -n 30 || true
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a32-smart-launcher-apk
          path: bin/*.apk
