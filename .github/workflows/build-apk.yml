name: Build Seller Hub APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-dev git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --break-system-packages --upgrade buildozer "cython<3.1" virtualenv setuptools

      - name: Cache buildozer and gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-clean-u24-arm64-${{ hashFiles('buildozer.spec') }}

      - name: Build APK with Buildozer
        run: |
          export PATH="$PATH:~/.local/bin"
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seller-hub-apk
          path: bin/*.apk
