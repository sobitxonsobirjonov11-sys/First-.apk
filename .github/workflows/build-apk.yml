name: Build A32 Smart Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            libsqlite3-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --user buildozer "Cython==0.29.36" virtualenv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Buildozer, Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-arm64-py311-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-arm64-py311-

      - name: Build APK with Buildozer
        run: |
          touch build.log
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo "Build completed without producing an APK."
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a32-smart-launcher-apk
          path: bin/*.apk
          if-no-files-found: error
